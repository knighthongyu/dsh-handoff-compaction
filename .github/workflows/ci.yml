name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release

  verify-previous-dsh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-version: [0.1.7-rc.2, 0.2.0-rc.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --prefix "$RUNNER_TEMP/dsh-previous" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh-version }}
      - run: DSH_SMOKE_DSH_BIN="$RUNNER_TEMP/dsh-previous/node_modules/.bin/dsh" node scripts/verify-release.mjs
