# Replace DSH's root compactor without touching the inherited lifecycle or /compact command.
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  disabled: true

- insert:
    - id: handoff-compaction
      name: dsh-handoff-compaction
      config:
        thresholdRatio: 0.8
        retainTokens: 16000
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true
